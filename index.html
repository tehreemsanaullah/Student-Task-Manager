<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Task Manager</h1>
        
        <!-- Search Input Bar -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search tasks...">
        </div>

        <form id="task-form">
            <input type="text" id="task-title" placeholder="Task Title" required>
            <textarea id="task-desc" placeholder="Task Description"></textarea>
            <button type="submit">Add Task</button>
        </form>

        <!-- Task Count Badge -->
        <div class="task-count-container">
            <span>Total Tasks: <span id="task-count">0</span></span>
        </div>

        <!-- Task List Container -->
        <ul id="task-list"></ul>

        <!-- Clear All Tasks Button -->
        <button id="clear-btn" class="secondary-btn" style="margin-top: 15px; display: none;">Clear All Tasks</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
